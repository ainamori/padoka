# Padoka - docker compose（host ネットワーク版）
#
#   docker compose -f docker-compose.host.yml up -d
#
# network_mode: host を使用し、コンテナが client_server.port（デフォルト
# 6667）に直接バインドします。ポート公開・NAT なしの高速な構成です。
# Linux のみ対応。

services:
  padoka:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: padoka
    image: padoka:py
    restart: unless-stopped
    network_mode: host
    environment:
      PADOKA_CONFIG: /app/config/padoka.yml
      TZ: ${TZ:-UTC}
      # healthcheck が読むポート（= config の client_server.port）
      PADOKA_CLIENT_PORT: "${PADOKA_CLIENT_PORT:-6667}"
    # host ネットワークのためポート公開は不要。
    # IRC クライアントは client_server.port（デフォルト 6667）、WebUI
    # （有効化時）は 8080 に直接バインドされる。
    # 生存判定: クライアントポートが accept できれば healthy。
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket; socket.create_connection(('127.0.0.1', int(os.environ.get('PADOKA_CLIENT_PORT','6667'))), 3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - padoka-log:/app/log

volumes:
  padoka-log:
