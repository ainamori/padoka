# Padoka - サンプル設定
# 起動:  python -m padoka -c config/padoka.yml
#        padoka -c config/padoka.yml
#
# キーは snake_case。完全なデフォルト値は src/padoka/config.py を参照。

setting_name: mypadoka
loglevel: 2                # 0 quiet, 1 ch log, 2 normal, 3 debug
padoka_server_name: PadokaProgram

# ------------------------------------------------------------- クライアントサーバー
client_server:
  host: null               # バインド対象インターフェース。null => 0.0.0.0
  port: 6667               # null => リスニングしない
  pass: PadokaPassWord     # IRC クライアントが /PASS で送るパスワード（SASL PLAIN でも検証）
  sasl: true               # SASL (ircv3) PLAIN 認証を有効。false で /PASS のみ
  acl: null                # null => 全許可（デフォルト）
  # ソースIPで制限する場合、上から順に判定（最初一致で確定。
  # 一致しなければ許可）。 具体的な allow を deny all より前に書く。
  # 例（LAN のみ許可）:
  #   acl: |
  #     allow 127.0.0.1
  #     allow 192.168.0.0/24
  #     allow 10.0.0.0/8
  #     allow 172.16.0.0/12
  #     deny all
  # -- TLS --
  # 証明書/秘密鍵を指定するとクライアントポートは TLS のみになる
  # （平文接続は拒否される）。 自己署名の再生成例:
  #   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
  #     -keyout config/certs/padoka.key -out config/certs/padoka.crt \
  #     -subj "/CN=padoka" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
  # TLS を無効化するには次の 2 行をコメントアウトする。
  # 本番で公開する場合は CA 発行証や Let's Encrypt 等へ差し替えてください。
  ssl_cert_file: config/certs/padoka.crt
  ssl_key_file: config/certs/padoka.key

# --------------------------------------------------------------- IRC サーバー
# 接続先 IRC サーバー。複数指定するとランダム選択し、
# 再接続時にローテーション。 TLS 利用は ssl_params を追加。
servers:
  - host: irc.ircnet.ne.jp     # メインドメイン（DNS RoundRobin）
    port: 6697                 # SSL/TLS
    pass: null
    ssl_params:
      verify: true
  - host: dh.ircnet.ne.jp      # デッドホスト（固定 IP 125.6.255.10）
    port: 6697
    pass: null
    ssl_params:
      verify: true
  # 開発サーバー / IPv6 / 非TLS のオプションは config/padoka.ircnet.yml 参照
  # - host: 127.0.0.1
  #   port: 6667
  #   pass: null

# --------------------------------------------------------------- ユーザー情報
user: padoka
nick: padoka_py
hostname: null             # null => システムホスト名を使用
servername: "*"
realname: padoka user
mode: null
away_message: away
away_nick: null            # null => クライアント不在時に nick を変えない
quit_message: "Quit Padoka"

reconnect_delay: 150       # 再接続待ち時間（秒）

# --------------------------------------------------------------- ログ出力
log_dir: ./log
default_log:
  file: "${setting_name}-${channel_name}/%y%m%d.log"
  time_format: "%H:%M:%S"

# --------------------------------------------------------------- チャンネル
# timing: startup（デフォルト）| login
# 追加: key（参加キー）, initial_mode, auto_create, backlog_lines
channel_info:
  "#test":
    timing: startup
    # initial_mode: "+nt"
    # key: secret
    # backlog_lines: 20

# --------------------------------------------------------------- ボット
# プラグインのモジュール/クラス名、または name + 設定の dict。
# プラグイン .py ファイルは plugins_dir に配置。
plugins_dir: ./plugins
bots:
  - name: backlogbot
    talker: false
    prefix: "BL"
    sender: "backlogbot"
    time_format: "%m/%d-%H:%M"
  - name: autoawaybot
    threshold: 900          # 15分間操作がないと AWAY
    message: "Away"

