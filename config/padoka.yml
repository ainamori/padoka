# Padoka - サンプル設定
# 起動:  python -m padoka -c config/padoka.yml
#        padoka -c config/padoka.yml
#
# キーは snake_case。完全なデフォルト値は src/padoka/config.py を参照。

setting_name: mypadoka
loglevel: 2                # 0 quiet, 1 ch log, 2 normal, 3 debug
padoka_server_name: PadokaProgram

# ------------------------------------------------------------- クライアントサーバー
client_server:
  host: null               # バインド対象インターフェース。null => 0.0.0.0
  port: 6667               # null => リスニングしない
  pass: PadokaPassWord     # IRC クライアントが /PASS で送るパスワード
  acl: null                # null => 全許可（デフォルト）
  # ソースIPで制限する場合、上から順に判定（最初一致で確定。
  # 一致しなければ許可）。 具体的な allow を deny all より前に書く。
  # 例（LAN のみ許可）:
  #   acl: |
  #     allow 127.0.0.1
  #     allow 192.168.0.0/24
  #     allow 10.0.0.0/8
  #     allow 172.16.0.0/12
  #     deny all
  # ssl_cert_file: cert.pem
  # ssl_key_file: key.pem

# ------------------------------------------------------------- Web UI
# ブラウザからログ閲覧・発言できる簡易 WebUI（stdlib のみ・依存なし）。
# 有効化: enabled: true  にして再起動。 pass を設定するとトークン認証が必須。
webui:
  enabled: false
  host: 0.0.0.0               # バインド対象。LAN/リモートから使う場合は 0.0.0.0
  port: 8080
  pass: ""                    # 空 = 認証なし（危険）。設定するとトークン必須
  title: "Padoka WebUI"
  buffer: 200                 # チャネルごとのインメモリ保持行数

# --------------------------------------------------------------- IRC サーバー
# 接続先 IRC サーバー。複数指定するとランダム選択し、
# 再接続時にローテーション。 TLS 利用は ssl_params を追加。
servers:
  - host: dev.ircnet.ne.jp   # ircnet 開発サーバー（SASL-open・海外でも接続可）
    port: 6697               # SSL/TLS & SASL（旧 SSL ポートは 6679）
    pass: null
    ssl_params:
      verify: true           # ircnet は Let's Encrypt 発行
    # 上流 SASL（ircv3 PLAIN）。NICK/USER より前に AUTHENTICATE を行い、
    # 904 (success) を確認してから登録する。
    #   username = IRC ネットワークのアカウント名（ircnet は NickServ アカウント）
    #   password = そのアカウントのパスワード（平文になるため chmod 600 を推奨）
    # username を省略すると下の user: の値がアカウント名になる。
    # 留意: dev は開発・検証サーバーのため予告なく再起動される。
    #       長期運用は irc.ircnet.ne.jp / dh.ircnet.ne.jp へ切替。
    sasl:
      username: myuser
      password: "hogehoge"
  # - host: 127.0.0.1
  #   port: 6667
  #   pass: null

# --------------------------------------------------------------- ユーザー情報
user: username
nick: nickname
hostname: null             # null => システムホスト名を使用
servername: "*"
realname: padoka user
mode: null
away_message: away
away_nick: null            # null => クライアント不在時に nick を変えない
quit_message: "Quit Padoka"

reconnect_delay: 150       # 再接続待ち時間（秒）

# --------------------------------------------------------------- ログ出力
log_dir: ./log
default_log:
  file: "${setting_name}-${channel_name}/%y%m%d.log"
  time_format: "%H:%M:%S"

# --------------------------------------------------------------- チャンネル
# timing: startup（デフォルト）| login
# 追加: key（参加キー）, initial_mode, auto_create, backlog_lines
channel_info:
  "#test":
    timing: startup
    # initial_mode: "+nt"
    # key: secret
    # backlog_lines: 20

# --------------------------------------------------------------- ボット
# プラグインのモジュール/クラス名、または name + 設定の dict。
# プラグイン .py ファイルは plugins_dir に配置。
plugins_dir: ./plugins
bots:
  - name: backlogbot
    talker: false
    prefix: "BL"
    sender: "backlogbot"
    time_format: "%m/%d-%H:%M"
  - name: autoawaybot
    threshold: 900          # 15分間操作がないと AWAY
    message: "Away"

